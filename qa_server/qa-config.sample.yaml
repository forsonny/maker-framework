# QA MCP Server Configuration
# Copy this file to qa-config.yaml and customize as needed

# Test execution settings
test:
  framework: auto          # auto, pytest, jest, mocha, unittest, command
  # Optional project test command: executable followed by literal arguments.
  # With auto, a configured command takes precedence over framework discovery.
  # An explicit built-in framework overrides the command. Example for Lua:
  # command: ["lua", "tests/run.lua"]
  # Runs in the target project. Quote each argument separately, including paths
  # with spaces. No shell expansion; use an explicit shell command if needed.
  # Windows npm example: ["cmd.exe", "/c", "npm test"]
  # Keep patterns empty and parallel false; put such options in the command.
  # Reports command status/output only, not test counts, coverage or regressions.
  patterns: []             # Use framework defaults; specify only patterns for your framework
  timeout_seconds: 300     # Maximum test execution time
  parallel: false          # Enable parallel test execution (pytest-xdist)
  extra_args: []           # Additional arguments passed to test framework
  # Pre-test hooks: commands to run before tests (e.g., database reset, container setup)
  pre_hooks: []
  # Example: pre_hooks: ["docker-compose up -d db", "python manage.py migrate"]
  # Post-test hooks: commands to run after tests (e.g., cleanup, report generation)
  post_hooks: []
  # Example: post_hooks: ["docker-compose down", "rm -rf tmp/"]

# Coverage analysis settings
coverage:
  threshold: 70.0          # Minimum coverage percentage
  source_patterns:         # Source files to include in coverage measurement
    - "src/**/*.py"
    - "src/**/*.js"
  exclude_patterns:        # Files to exclude from coverage
    - "**/test/**"
    - "**/tests/**"
    - "**/__pycache__/**"
  timeout_seconds: 300     # Coverage collection timeout

# Regression analysis settings
regression:
  baseline_file: "qa-reports/baseline.json"
  auto_update_baseline: false
  ignore_flaky: true
  flaky_threshold: 3       # Flips before marking test as flaky

# General settings
reports_dir: "qa-reports"  # Directory for test reports
verbose: false             # Enable verbose output
