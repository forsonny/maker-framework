name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install regression dependencies
        run: python -m pip install -r qa_server/requirements.txt pytest coverage
      - name: Run regression suite
        run: python -m unittest discover -s tests -v

  javascript-adapters:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install adapter check dependencies
        run: python -m pip install -r qa_server/requirements.txt
      - name: Install pinned JavaScript dependencies
        working-directory: tests/javascript
        run: npm ci
      - name: Run JavaScript adapter checks
        run: python -m unittest discover -s tests/javascript -p checks.py -v
